# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-nilm-l0
description: >
  Estimates the heat pump compressor's 15-minute mean electrical power in W from
  the site's transformer-rated main meter (factor 50) alone. Each result
  describes the last completed 15-minute interval and carries that interval's
  start as its timestamp.
image: ghcr.io/senergy-platform/ode-ablation-nilm-l0:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs: both come from the main meter.
# energy is OBIS 1.8.0 (raw import counter, kWh), power is OBIS 16.7 (raw W).
inputs:
  - name: energy
    type: float
  - name: power
    type: float

# What the operator emits. These are the keys of the dictionary infer() returns.
outputs:
  - name: prediction
    type: float

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
